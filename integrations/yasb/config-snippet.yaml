# Copy into %USERPROFILE%\.config\yasb\config.yaml
# Requires aiMonitor tray app + localhost API on port 6736.

widgets:
  ai_usage:
    type: "yasb.custom.CustomWidget"
    options:
      label: "<span class=\"c\">C</span> {data[cursor][total]}% · <span class=\"g\">G</span> {data[opencode_go][rolling]}% · <span class=\"a\">AG</span> {data[antigravity][gemini_5h]}%"
      label_alt: "{data[label_alt]}"
      label_placeholder: "AI…"
      class_name: "ai-usage-widget"
      tooltip: true
      tooltip_label: "{data[tooltip]}"
      exec_options:
        run_cmd: "%LOCALAPPDATA%\\Programs\\aiMonitor\\integrations\\yasb\\fetch-usage.cmd"
      callbacks:
        on_left: "toggle_label"
        on_right: "exec start \"\" \"%LOCALAPPDATA%\\Programs\\aiMonitor\\aiMonitor.exe\""


name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install

      - name: Build Tauri app
        run: bun tauri build --no-bundle

      - name: Package single exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.ref_name }}"
          $exe = Get-ChildItem src-tauri/target/release -Filter aiMonitor.exe | Select-Object -First 1
          if (-not $exe) { throw 'Build produced no aiMonitor.exe' }
          $out = "aiMonitor-$tag-win-x64.exe"
          Copy-Item $exe.FullName $out
          "{0:N1} MB" -f ((Get-Item $out).Length / 1MB)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: aiMonitor-${{ github.ref_name }}-win-x64.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}

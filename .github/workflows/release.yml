name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish Native AOT single-file
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart("v")
          dotnet publish -c Release -r win-x64 `
            -p:Version=$ver `
            -o .\publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $exe = Get-ChildItem .\publish -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw 'Publish produced no exe' }
          Get-ChildItem .\publish -Filter *.pdb -File | Remove-Item -Force
          $sidecars = Get-ChildItem .\publish -File | Where-Object {
            $_.Name -ne $exe.Name -and $_.Extension -notin '.pdb'
          }
          if ($sidecars) {
            throw ("Expected single exe, leftover: " + ($sidecars.Name -join ', '))
          }

          $out = ".\aiMonitor-$tag-win-x64.exe"
          Move-Item $exe.FullName $out
          "{0:N1} MB" -f ((Get-Item $out).Length / 1MB)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: aiMonitor-${{ github.ref_name }}-win-x64.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
